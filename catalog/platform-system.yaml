apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: platform-engineering-demo
  description: Reusable Terraform modules, GitOps-managed cluster add-ons, and a self-service Backstage template — the platform every "hello world" app is built on top of
spec:
  owner: platform-team
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage-portal
  description: The Internal Developer Portal itself
  links:
    - url: https://github.com/bernadin-kabore/platform-demo-backstage
      title: Source
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: platform-engineering-demo
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: platform-demo-gitops
  description: ArgoCD's source of truth for every cluster add-on and application
  links:
    - url: https://github.com/bernadin-kabore/platform-demo-gitops
      title: Source
spec:
  type: gitops-repo
  owner: platform-team
  system: platform-engineering-demo
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: platform-demo-terraform-modules
  description: Reusable Terraform modules provisioning the AWS infrastructure
  links:
    - url: https://github.com/bernadin-kabore/platform-demo-terraform-modules
      title: Source
spec:
  type: infrastructure
  owner: platform-team
  system: platform-engineering-demo
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ai-platform-agent
  description: >-
    Turns a natural-language platform request from this portal into pull
    requests across the four platform repositories, gated by its own automated
    eval suite. Opens pull requests; merges nothing.
  annotations:
    github.com/project-slug: bernadin-kabore/platform-demo-ai-agent
    backstage.io/kubernetes-id: ai-platform-agent
    argocd/app-name: ai-platform-agent
  links:
    - url: https://github.com/bernadin-kabore/platform-demo-ai-agent
      title: Source
    - url: https://github.com/bernadin-kabore/platform-demo-ai-agent/blob/main/docs/evals.md
      title: How the eval gate works
      icon: docs
spec:
  type: service
  lifecycle: experimental
  owner: platform-team
  system: platform-engineering-demo
