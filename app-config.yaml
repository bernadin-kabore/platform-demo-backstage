app:
  title: Platform Engineering Portal
  baseUrl: http://localhost:3000

organization:
  name: Acme

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  database:
    client: better-sqlite3
    connection: ":memory:" # swap for postgres in app-config.production.yaml

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  environment: development
  providers:
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}

scaffolder:
  defaultAuthor:
    name: platform-bot
    email: platform-bot@acme.io

# Read by the platform:github:branch-protection custom scaffolder action
# (packages/backend/src/modules/branch-protection) — the numeric App ID of the
# "platform-deploy-bot" GitHub App. Not a secret, but environment-specific, so
# it is not hardcoded in the action.
#
# It is only consulted when a caller passes allowDeployBotBypass: true, which
# defaults to false and which nothing in the application template sets. No
# repository this platform scaffolds is given a ruleset exemption — that was
# removed deliberately, and the input exists only so a future repository whose
# own CI must push to a protected branch can ask for one explicitly.
platform:
  deployBotAppId: ${PLATFORM_DEPLOY_BOT_APP_ID}

  # Read by the platform:ai:request custom scaffolder action
  # (packages/backend/src/modules/ai-platform-request) — the in-cluster address
  # of the AI Platform Agent. In the cluster this resolves to
  # http://ai-platform-agent.ai-platform.svc.cluster.local; the agent's
  # NetworkPolicy accepts ingress only from this namespace and it is not
  # exposed outside the cluster at all.
  #
  # Note that no model credential appears anywhere in this file. The portal
  # never talks to Claude — the agent does, from inside the cluster, using an
  # IRSA role rather than a key.
  aiAgent:
    baseUrl: ${AI_PLATFORM_AGENT_URL}

    # The GitHub owner the agent's App is installed on. The platform:ai:request
    # action compares this against the github.com/project-slug annotation of the
    # service a developer selected, and refuses when they disagree.
    #
    # Without the check, a Component annotated with a slug under some other
    # organisation would resolve to a bare repository name, and the agent —
    # which prefixes every repository with its own configured owner — would
    # authorize a same-named repository in this organisation instead. That is a
    # narrow path and an entirely silent one, which is exactly the kind worth
    # closing explicitly.
    githubOwner: bernadin-kabore

catalog:
  rules:
    - allow: [Component, System, API, Group, User, Resource, Location, Template]
  locations:
    - type: file
      target: ./catalog/org.yaml
    - type: file
      target: ./catalog/platform-system.yaml
    - type: url
      target: https://github.com/bernadin-kabore/platform-demo-hello-world-template/blob/main/catalog-info.yaml
      rules:
        - allow: [Location, Template]

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: platform-demo
          url: ${K8S_CLUSTER_URL}
          authProvider: aws
          skipTLSVerify: false

argocd:
  appLocatorMethods:
    - type: config
      instances:
        - name: main
          url: ${ARGOCD_URL}
          token: ${ARGOCD_AUTH_TOKEN}

grafana:
  domain: ${GRAFANA_URL}
  unifiedAlerting: true

techdocs:
  builder: local
  generator:
    runIn: docker
  publisher:
    type: local
