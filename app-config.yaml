app:
  title: Platform Engineering Portal
  baseUrl: http://localhost:3000

organization:
  name: Acme

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  database:
    client: better-sqlite3
    connection: ":memory:" # swap for postgres in app-config.production.yaml

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}

auth:
  environment: development
  providers:
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}

scaffolder:
  defaultAuthor:
    name: platform-bot
    email: platform-bot@acme.io

# Read by the platform:github:branch-protection custom scaffolder action
# (packages/backend/src/modules/branch-protection) to exempt the deploy bot
# from the ruleset it creates on every scaffolded repo — the numeric App ID
# of the "platform-deploy-bot" GitHub App, not a secret itself, but still
# environment-specific, so it's not hardcoded in the action.
platform:
  deployBotAppId: ${PLATFORM_DEPLOY_BOT_APP_ID}

  # Read by the platform:ai:request custom scaffolder action
  # (packages/backend/src/modules/ai-platform-request) — the in-cluster address
  # of the AI Platform Agent. In the cluster this resolves to
  # http://ai-platform-agent.ai-platform.svc.cluster.local; the agent's
  # NetworkPolicy accepts ingress only from this namespace and it is not
  # exposed outside the cluster at all.
  #
  # Note that no model credential appears anywhere in this file. The portal
  # never talks to Claude — the agent does, from inside the cluster, using an
  # IRSA role rather than a key.
  aiAgent:
    baseUrl: ${AI_PLATFORM_AGENT_URL}

catalog:
  rules:
    - allow: [Component, System, API, Group, User, Resource, Location, Template]
  locations:
    - type: file
      target: ./catalog/org.yaml
    - type: file
      target: ./catalog/platform-system.yaml
    - type: url
      target: https://github.com/bernadin-kabore/platform-demo-hello-world-template/blob/main/catalog-info.yaml
      rules:
        - allow: [Location, Template]

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: platform-demo
          url: ${K8S_CLUSTER_URL}
          authProvider: aws
          skipTLSVerify: false

argocd:
  appLocatorMethods:
    - type: config
      instances:
        - name: main
          url: ${ARGOCD_URL}
          token: ${ARGOCD_AUTH_TOKEN}

grafana:
  domain: ${GRAFANA_URL}
  unifiedAlerting: true

techdocs:
  builder: local
  generator:
    runIn: docker
  publisher:
    type: local
